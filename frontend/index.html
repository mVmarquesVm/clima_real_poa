<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Forno Alegre: sensação térmica real em locais de lazer do Centro de Porto Alegre, com recomendação de onde e quando ir."
    />
    <title>Forno Alegre</title>
    <script>
      // Aplica o tema ANTES de desenhar a página (senão ela "pisca" clara e
      // depois escurece). Vale a escolha salva; sem escolha, o tema do sistema.
      // A chave é a mesma do src/ganchos/useTema.js.
      ;(function () {
        var salvo = null
        try {
          salvo = localStorage.getItem('forno-alegre:tema')
        } catch (e) {
          /* armazenamento bloqueado: usa o sistema */
        }
        var escuro = salvo ? salvo === 'escuro' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.tema = escuro ? 'escuro' : 'claro'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
